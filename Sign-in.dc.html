<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;background:#FFFFFF}
  a{text-decoration:none}
  input::placeholder{color:#A1A1A6}
</style>
</helmet>

<div style="min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:#FFFFFF">

  <!-- LEFT — form panel -->
  <div style="display:flex;align-items:center;justify-content:center;padding:48px 32px">
    <div style="width:100%;max-width:360px;display:flex;flex-direction:column;align-items:stretch">

      <img src="logos/layers-black.png" alt="Layers" style="width:150px;height:auto;display:block;margin:0 auto">
      <p style="margin:16px 0 0;text-align:center;font-size:13px;color:#6E6E73">Plateforme d'intelligence pour l'analyse de signaux</p>

      <div style="margin-top:36px;display:flex;flex-direction:column;gap:6px">
        <label style="font-size:13px;font-weight:500;color:#1D1D1F">E-mail</label>
        <input type="email" value="{{ email }}" onInput="{{ onEmail }}" placeholder="vous@exemple.com" style="height:44px;padding:0 14px;border:1px solid #E4E4E7;background:#FFFFFF;font-family:inherit;font-size:14px;color:#1D1D1F;outline:none" style-focus="border-color:#0A0A0A">
      </div>

      <div style="margin-top:18px;display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <label style="font-size:13px;font-weight:500;color:#1D1D1F">Mot de passe</label>
          <a href="#" style="font-size:12px;color:#6E6E73" style-hover="color:#1D1D1F">Mot de passe oublié ?</a>
        </div>
        <div style="position:relative;display:flex;align-items:center">
          <input type="{{ pwType }}" value="{{ pwd }}" onInput="{{ onPwd }}" placeholder="••••••••••" style="width:100%;height:44px;padding:0 44px 0 14px;border:1px solid #E4E4E7;background:#FFFFFF;font-family:inherit;font-size:14px;color:#1D1D1F;outline:none" style-focus="border-color:#0A0A0A">
          <button onClick="{{ togglePw }}" type="button" aria-label="Afficher le mot de passe" style="position:absolute;right:6px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;cursor:pointer;color:#6E6E73" style-hover="color:#1D1D1F">
            <sc-if value="{{ pwVisible }}" hint-placeholder-val="{{ false }}">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6Z"/><circle cx="10" cy="10" r="2.5"/><line x1="3" y1="3" x2="17" y2="17"/></svg>
            </sc-if>
            <sc-if value="{{ pwHidden }}" hint-placeholder-val="{{ true }}">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6Z"/><circle cx="10" cy="10" r="2.5"/></svg>
            </sc-if>
          </button>
        </div>
      </div>

      <button onClick="{{ toggleRemember }}" type="button" style="margin-top:16px;display:flex;align-items:center;gap:9px;border:none;background:transparent;padding:0;cursor:pointer;font-family:inherit">
        <span style="width:16px;height:16px;border:1.5px solid {{ rememberBoxBorder }};background:{{ rememberBoxBg }};display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <sc-if value="{{ remember }}" hint-placeholder-val="{{ true }}">
            <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3,8.5 6.5,12 13,4.5"/></svg>
          </sc-if>
        </span>
        <span style="font-size:13px;color:#1D1D1F">Se souvenir de moi</span>
      </button>

      <button type="submit" style="margin-top:20px;height:46px;border:none;background:#101828;color:#FFFFFF;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer" style-hover="background:#1D2739">Connexion</button>

      <div style="margin-top:24px;display:flex;align-items:center;gap:14px">
        <span style="flex:1;height:1px;background:#EAEAEC"></span>
        <span style="font-size:11px;font-weight:500;letter-spacing:0.06em;color:#A1A1A6">OU CONTINUER AVEC</span>
        <span style="flex:1;height:1px;background:#EAEAEC"></span>
      </div>

      <div style="margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <button type="button" style="height:44px;display:flex;align-items:center;justify-content:center;gap:9px;border:1px solid #E4E4E7;background:#FFFFFF;font-family:inherit;font-size:14px;font-weight:500;color:#1D1D1F;cursor:pointer" style-hover="background:#FAFAFA;border-color:#D4D4D8">
          <svg width="16" height="16" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62Z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18Z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3-2.33Z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3 2.33C4.68 5.16 6.66 3.58 9 3.58Z"/></svg>
          Google
        </button>
        <button type="button" style="height:44px;display:flex;align-items:center;justify-content:center;gap:9px;border:1px solid #E4E4E7;background:#FFFFFF;font-family:inherit;font-size:14px;font-weight:500;color:#1D1D1F;cursor:pointer" style-hover="background:#FAFAFA;border-color:#D4D4D8">
          <svg width="15" height="15" viewBox="0 0 16 16"><rect x="0" y="0" width="7.2" height="7.2" fill="#F25022"/><rect x="8.8" y="0" width="7.2" height="7.2" fill="#7FBA00"/><rect x="0" y="8.8" width="7.2" height="7.2" fill="#00A4EF"/><rect x="8.8" y="8.8" width="7.2" height="7.2" fill="#FFB900"/></svg>
          Microsoft
        </button>
      </div>

      <p style="margin:28px 0 0;text-align:center;font-size:13px;color:#6E6E73">Pas de compte ? <a href="Onboarding.dc.html" style="color:#1D1D1F;font-weight:600" style-hover="text-decoration:underline">S'inscrire</a></p>

    </div>
  </div>

  <!-- RIGHT — brand panel -->
  <div style="position:relative;overflow:hidden;background:#0A0A0A;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px">
    <img src="textures/signin-bg.png" alt="" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block">
    <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:96px;width:100%;max-width:640px">
      <img src="logos/layers-white.png" alt="Layers" style="width:400px;max-width:70%;height:auto;display:block">
      <h1 style="margin:0;text-align:center;color:#FFFFFF;font-weight:500;font-size:40px;line-height:1.18;letter-spacing:-0.01em">Grow your GEO services<br>with real insights</h1>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { email: "clement@trylayers.ai", pwd: "monmotdepasse", remember: true, pwVisible: false };
  renderVals() {
    const v = this.state.pwVisible;
    return {
      email: this.state.email,
      pwd: this.state.pwd,
      remember: this.state.remember,
      pwVisible: v,
      pwHidden: !v,
      pwType: v ? "text" : "password",
      rememberBoxBg: this.state.remember ? "#101828" : "#FFFFFF",
      rememberBoxBorder: this.state.remember ? "#101828" : "#C7C7CC",
      onEmail: (e) => this.setState({ email: e.target.value }),
      onPwd: (e) => this.setState({ pwd: e.target.value }),
      togglePw: () => this.setState((s) => ({ pwVisible: !s.pwVisible })),
      toggleRemember: () => this.setState((s) => ({ remember: !s.remember })),
    };
  }
}
</script>
</body>
</html>
